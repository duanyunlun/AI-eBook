name: Cross-platform Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git ref to build (existing tag when publishing)
        required: true
        type: string
      android_only:
        description: Retry Android without rebuilding desktop packages
        type: boolean
        default: false
      desktop_only:
        description: Build desktop packages when Android is verified locally
        type: boolean
        default: false
      validation_only:
        description: Build and verify without uploading to a Release
        type: boolean
        default: false
      android_artifact_run_id:
        description: Optional existing run containing android-built-apks for this tag
        type: string
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  desktop:
    if: ${{ !inputs.android_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            arch: arm64
            bundles: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
            bundles: dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            arch: x64
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: 使用官方 crates.io（仓库内镜像配置仅服务本地构建）
        run: node -e "require('fs').rmSync('.cargo/config.toml',{force:true})"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: node scripts/prepare-node.mjs ${{ matrix.arch }}
      - run: node scripts/check-dsh.mjs
      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: true
        with:
          tagName: ${{ !inputs.validation_only && inputs.tag || '' }}
          releaseDraft: true
          prerelease: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.desktop.conf.json
  android_node:
    if: ${{ !inputs.desktop_only && inputs.android_artifact_run_id == '' }}
    uses: ./.github/workflows/node-android.yml
    with:
      ref: ${{ inputs.tag }}
  android:
    needs: android_node
    if: ${{ !inputs.desktop_only && inputs.android_artifact_run_id == '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: 使用官方 crates.io（仓库内镜像配置仅服务本地构建）
        run: node -e "require('fs').rmSync('.cargo/config.toml',{force:true})"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - run: sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - name: Generate Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          npm run tauri -- android init --ci --skip-targets-install
      - uses: actions/download-artifact@v4
        with:
          pattern: android-node-*
          path: .build-cache/android-node
      - run: node scripts/prepare-android.mjs
      - name: Prepare preview signing key
        env:
          ANDROID_PREVIEW_KEYSTORE: ${{ secrets.ANDROID_PREVIEW_KEYSTORE }}
        run: |
          test -n "$ANDROID_PREVIEW_KEYSTORE"
          umask 077
          printf '%s' "$ANDROID_PREVIEW_KEYSTORE" | base64 --decode > .build-cache/android-preview.p12
      - name: Build test APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384
          AI_EBOOK_ANDROID_KEYSTORE: ${{ github.workspace }}/.build-cache/android-preview.p12
          AI_EBOOK_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_STORE_PASSWORD }}
        run: npm run tauri -- android build --debug --apk --split-per-abi --target aarch64 x86_64 --ci
      - run: python3 scripts/check-android-apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-built-apks
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
  android_verify:
    needs: android
    if: ${{ !cancelled() && !inputs.desktop_only && (needs.android.result == 'success' || inputs.android_artifact_run_id != '') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .build-cache/ci
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: actions/download-artifact@v4
        with:
          name: android-built-apks
          path: src-tauri/gen/android/app/build/outputs/apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.android_artifact_run_id || github.run_id }}
      - run: sdkmanager 'build-tools;35.0.0'
      - name: Enable KVM for emulator
        run: |
          df -h .
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          script: bash .build-cache/ci/scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-check
          path: .build-cache/android-smoke
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Upload test APK
        if: ${{ !inputs.validation_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          find src-tauri/gen/android/app/build/outputs/apk -name '*arm64*.apk' -exec cp {} AI-eBook-Android-arm64-preview.apk \;
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify AI-eBook-Android-arm64-preview.apk
          gh release upload "$RELEASE_TAG" AI-eBook-Android-arm64-preview.apk --clobber
