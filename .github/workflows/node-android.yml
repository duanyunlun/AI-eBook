name: Android Node runtime
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.build-cache/ccache/${{ matrix.arch }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/cache@v4
        id: runtime
        with:
          path: .build-cache/android-node/${{ matrix.arch }}
          key: android-node-${{ matrix.arch }}-${{ hashFiles('scripts/build-android-node.sh') }}
      - uses: actions/cache/restore@v4
        if: steps.runtime.outputs.cache-hit != 'true'
        id: compiler
        with:
          path: .build-cache/ccache/${{ matrix.arch }}
          key: android-node-compiler-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: android-node-compiler-${{ matrix.arch }}-
      - if: steps.runtime.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ccache
      - uses: actions/setup-java@v4
        if: steps.runtime.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        if: steps.runtime.outputs.cache-hit != 'true'
      - if: steps.runtime.outputs.cache-hit != 'true'
        run: sdkmanager 'ndk;27.2.12479018'
      - if: steps.runtime.outputs.cache-hit != 'true'
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          bash scripts/build-android-node.sh ${{ matrix.arch }} &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            sleep 60
            if test -f .build-cache/node-source-${{ matrix.arch }}/build.log; then
              wc -l .build-cache/node-source-${{ matrix.arch }}/build.log
            fi
          done
          wait "$build_pid"
      - uses: actions/cache/save@v4
        if: always() && steps.runtime.outputs.cache-hit != 'true'
        with:
          path: .build-cache/ccache/${{ matrix.arch }}
          key: ${{ steps.compiler.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-node-${{ matrix.arch }}-build-log
          path: .build-cache/node-source-${{ matrix.arch }}/build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: android-node-${{ matrix.arch }}
          path: .build-cache/android-node/${{ matrix.arch }}
          if-no-files-found: error
