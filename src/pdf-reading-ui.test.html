<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 阅读模式验证</title><div id="app"></div><output id="result" style="position:fixed;bottom:0;left:0;z-index:99999;background:white;color:black">运行中</output>
<script type="module">
import { mountShell } from './ui/shell.ts';
import { setupPdfReader } from './reader/pdf-reader.ts';
import { selectionAnchor, annotationRects } from './reader/annotation-anchor.ts';
import './styles.css';
const saved = localStorage.getItem('pdf-reading');
const typography = localStorage.getItem('reading-typography');
localStorage.removeItem('reading-typography');
localStorage.setItem('pdf-reading',JSON.stringify({mode:'reflow',crop:20,font:24,family:'serif',lineHeight:1.85}));
const stream = 'BT /F1 18 Tf 90 700 Td (Reading a PDF on a phone.) Tj 0 -30 Td (The original page stays attached to annotations.) Tj ET';
const objects = [
  '<< /Type /Catalog /Pages 2 0 R >>',
  '<< /Type /Pages /Kids [3 0 R 6 0 R] /Count 2 >>',
  '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 600 800] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
  '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
  `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`,
  '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 600 800] /Resources << >> /Contents 7 0 R >>',
  '<< /Length 0 >>\nstream\n\nendstream',
];
let pdf = '%PDF-1.4\n';
const offsets = [0];
objects.forEach((object,index) => { offsets.push(pdf.length); pdf += `${index+1} 0 obj\n${object}\nendobj\n`; });
const xref = pdf.length;
pdf += `xref\n0 8\n0000000000 65535 f \n${offsets.slice(1).map(offset=>String(offset).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<< /Size 8 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
const url = URL.createObjectURL(new Blob([pdf], {type:'application/pdf'}));
const textUrl=URL.createObjectURL(new Blob(['第一段正文。\n\n第二段正文。'],{type:'text/plain'}));
window.__TAURI_INTERNALS__ = {convertFileSrc:path=>path==='fixture.txt'?textUrl:url,invoke:async()=>{}};
const elements = mountShell(document.querySelector('#app'));
const reader = setupPdfReader(elements,()=>{},()=>{});
const get = id => document.getElementById(id);
const assert = (condition,message) => { if(!condition)throw new Error(message); };
const wait = async predicate => {
  for(let attempt=0;attempt<150;attempt++) { if(predicate())return; await new Promise(resolve=>setTimeout(resolve,30)); }
  throw new Error('等待页面超时');
};
const first = () => elements.pageStage.querySelector('[data-page="1"]');
const originalReady = () => first()?.querySelector('.textLayer span') && first()?.querySelector('canvas')?.dataset.rendering !== 'true';
try {
  const book={id:'pdf-test',title:'PDF test',format:'pdf',lastPage:1,storedPath:'fixture.pdf'};
  await reader.open(book);
  await wait(originalReady);
  assert(first().classList.contains('pdf-page')&&!first().querySelector('.text-page-content'),'旧重排偏好仍影响 PDF');
  assert(!get('pdf-reading-mode')&&!get('pdf-mode-toggle')&&!get('pdf-crop'),'PDF 排版入口仍存在');
  const span=first().querySelector('.textLayer span');
  const width=span.getBoundingClientRect().width;
  const range=document.createRange();range.selectNodeContents(span);
  window.getSelection().removeAllRanges();window.getSelection().addRange(range);
  const anchor=selectionAnchor(elements.pageStage,'pdf');
  assert(annotationRects(first(),anchor.locator,anchor.quote).length,'PDF 批注失效');
  assert(annotationRects(first(),{...anchor.locator,rects:[],start:0,end:anchor.quote.length},anchor.quote).length,'旧重排批注无法兼容');
  get('reading-font-size').value='32';get('reading-font-size').dispatchEvent(new Event('input'));
  get('reading-line-height').value='2.2';get('reading-line-height').dispatchEvent(new Event('change'));
  assert(JSON.parse(localStorage.getItem('reading-typography')).font===32,'正文字体偏好未保存');
  assert(span.getBoundingClientRect().width===width,'正文字体设置改变了 PDF');
  assert(!elements.zoomIn.disabled,'PDF 原版缩放被禁用');
  assert((await reader.readPage(book.id,1)).text.includes('Reading a PDF'),'PDF 阅读工具失效');
  await reader.open({id:'txt-test',title:'文本',format:'txt',lastPage:1,storedPath:'fixture.txt'});
  const content=first().querySelector('.text-page-content');
  assert(getComputedStyle(content).fontSize==='32px','TXT 字号未生效');
  assert(parseFloat(getComputedStyle(content).lineHeight)>70,'TXT 行距未生效');
  assert(content.textContent.includes('\n\n'),'TXT 分段丢失');
  assert(content.scrollWidth<=content.clientWidth,'TXT 窄屏溢出');
  get('result').textContent='PASS：移除 PDF 排版入口、忽略旧重排模式、PDF 缩放与批注兼容、TXT 字体行距分段';
} catch(error) { get('result').textContent='FAIL：'+error.message; }
finally {
  if(saved===null)localStorage.removeItem('pdf-reading');else localStorage.setItem('pdf-reading',saved);
  if(typography===null)localStorage.removeItem('reading-typography');else localStorage.setItem('reading-typography',typography);
}
</script></html>
