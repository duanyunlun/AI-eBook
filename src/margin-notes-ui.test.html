<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>选区批注回归</title><div id="app"></div><output id="result" style="position:fixed;left:10px;bottom:4px;z-index:99999;font-size:12px"></output>
<script type="module">
import {mountShell} from './ui/shell.ts';
import {setupPdfReader} from './reader/pdf-reader.ts';
import {setupMarginNotes} from './ui/margin-notes.ts';
import {setupDrawers} from './ui/drawers.ts';
import {closeMobilePage} from './ui/mobile-back.ts';
import {annotationRects} from './reader/annotation-anchor.ts';
import './styles.css';
const items = [];
localStorage.removeItem('annotations-pinned');
let failSave = true;
let failDelete = true;
window.confirm=()=>{throw new Error('不应调用系统 confirm');};
window.__TAURI_INTERNALS__ = {convertFileSrc:()=>location.origin+'/fixture.md',invoke:async(command,args)=>{
  if(command==='save_reading_page')return;
  if(command==='list_book_annotations')return structuredClone(items.filter(entry=>entry.item.bookId===args.bookId));
  if(command==='save_knowledge_item'){
    if(failSave)throw new Error('保存失败');
    const item={...args.request.item,id:crypto.randomUUID()};
    items.push({item,quote:args.request.evidence.textSnapshot,locator:args.request.evidence.locator});return item;
  }
  if(command==='update_knowledge_item'){ const entry=items.find(entry=>entry.item.id===args.request.id);Object.assign(entry.item,args.request);return entry.item; }
  if(command==='delete_knowledge_item'){if(failDelete)throw new Error('删除失败');items.splice(items.findIndex(entry=>entry.item.id===args.id),1);return;}
  throw new Error(command);
}};
const originalFetch=window.fetch.bind(window);
window.fetch=(url,options)=>String(url).endsWith('fixture.md')?Promise.resolve(new Response('# 阅读与思考\n\n阅读不是被动地接收信息，而是不断向文本提出问题。\n\n当一句话让你停下来，不妨先记录为什么，再回到上下文中寻找答案。批注保留了这次停顿，也保留了思考发生的位置。\n\n# 重新阅读\n\n在另一个时间回到同一段文字，我们常常会发现新的含义。')):originalFetch(url,options);
const elements=mountShell(document.querySelector('#app'));
const drawers=setupDrawers(elements);
const reader=setupPdfReader(elements,()=>{},()=>{});
const notes=setupMarginNotes(elements.pageStage,elements.annotationDrawer,drawers.openAnnotation,drawers.toggleAnnotation,()=>{});
const book={id:'book',editionId:'edition',title:'阅读与思考',format:'md',lastPage:1,storedPath:'fixture.md'};
const get=id=>document.getElementById(id);
const assert=(value,message)=>{if(!value)throw new Error(message);};
const tick=()=>new Promise(done=>setTimeout(done,35));
const wait=async(predicate)=>{for(let tries=0;tries<100&&!predicate();tries++)await tick();assert(predicate(),'等待状态超时');};
const write=async(text)=>{get('margin-note-body').querySelector('.tiptap').innerHTML='<p>'+text+'</p>';await tick();};
try {
  await reader.open(book);notes.setBook(book);await tick();
  const content=elements.pageStage.querySelector('.text-page-content');
  const range=document.createRange();range.setStart(content.firstChild,0);range.setEnd(content.firstChild,25);
  const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);
  document.dispatchEvent(new Event('selectionchange'));notes.annotate();
  assert(!get('margin-note-editor').hidden&&!get('margin-notes-panel').hidden,'未打开批注编辑');
  await write('这里强调的是主动阅读。下次重读时，先列出自己的问题。');
  get('margin-note-save').click();await wait(()=>get('margin-note-status').textContent.includes('保存失败'));
  assert(get('margin-note-body').textContent.includes('主动阅读'),'失败丢失正文');
  failSave=false;get('margin-note-save').click();await wait(()=>items.length===1&&get('margin-note-status').textContent==='已保存');
  assert(items[0].locator.annotation&&items[0].locator.start===0&&items[0].quote,'未绑定原文');
  await wait(()=>!!elements.pageStage.querySelector('.margin-note-mark'));
  get('margin-note-back').click();notes.setPage(2);assert(!get('margin-notes-list').querySelector('.margin-note-row'),'当前页筛选错误');
  get('margin-notes-scope').value='book';get('margin-notes-scope').dispatchEvent(new Event('change'));
  assert(get('margin-notes-list').querySelectorAll('.margin-note-row').length===1,'本书筛选错误');
  get('margin-notes-list').querySelector('button').click();await write('尚未保存的追加思考');
  notes.setBook({...book,id:'other'});await tick();notes.setBook(book);await tick();
  assert(get('margin-note-body').textContent.includes('追加思考'),'切书丢失草稿');
  get('margin-note-save').click();await wait(()=>items[0].item.bodyMd.includes('追加思考')&&!get('margin-note-save').disabled);
  get('margin-note-back').click();get('pin-margin-notes').click();
  document.activeElement?.blur();elements.reader.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));
  assert(elements.annotationDrawer.getAttribute('aria-hidden')==='false','固定侧栏仍然自动收起');
  const page=elements.pageStage.querySelector('.text-page');page.style.width='400px';await tick();
  assert(annotationRects(page,items[0].locator,items[0].quote).length>0,'重排后定位失败');
  get('margin-notes-list').querySelector('button').click();get('margin-note-delete').click();
  assert(get('margin-notes-panel').querySelector('.thread-delete-confirmation')&&!document.querySelector('dialog[open]'),'未显示行内确认或意外弹窗');
  get('margin-notes-panel').querySelector('.thread-delete-confirmation button:last-child').click();await tick();
  assert(items.length===1,'取消仍然删除了批注');
  get('margin-note-delete').click();get('margin-notes-panel').querySelector('.thread-delete-confirmation .thread-delete').click();
  await wait(()=>get('margin-note-status').textContent.includes('删除失败'));
  assert(items.length===1&&elements.pageStage.querySelector('.margin-note-mark'),'失败丢失批注');
  await tick();failDelete=false;get('margin-note-delete').click();get('margin-notes-panel').querySelector('.thread-delete-confirmation .thread-delete').click();
  await wait(()=>items.length===0&&!get('margin-note-delete').disabled);
  assert(!elements.pageStage.querySelector('.margin-note-mark'),'删除后仍有标记');
  items.push({item:{id:'demo',bookId:'book',kind:'thought',creator:'user',bodyMd:'这里强调的是主动阅读。下次重读时，先列出自己的问题。'},quote:range.toString().trim(),locator:{annotation:true,page:1,format:'md',editionId:'edition',start:0,end:25,rects:[]}});
  page.style.width='';notes.setBook(book);await tick();await notes.refresh();
  get('margin-notes-list').querySelector('button').click();
  await write('返回时必须保留这段未保存的批注');
  closeMobilePage(drawers, {closeAll:()=>{}});
  assert(get('margin-notes-panel').querySelector('.thread-delete-confirmation'),'返回绕过了未保存确认');
  closeMobilePage(drawers, {closeAll:()=>{}});
  assert(!get('margin-notes-panel').querySelector('.thread-delete-confirmation')&&!get('margin-note-editor').hidden,'返回没有取消确认');
  assert(get('margin-note-body').textContent.includes('必须保留'),'返回丢失草稿');
  get('margin-note-save').click();await wait(()=>get('margin-note-status').textContent==='已保存'&&!get('margin-note-save').disabled);
  get('result').textContent='PASS：选区绑定、保存失败保留、筛选、切书草稿、编辑保存、固定、重排定位、删除标记、返回保留未保存批注';
}catch(error){get('result').textContent='FAIL：'+error.stack;}
</script></html>
